name: "Container: vmless (local build)"

on:
  push:
    branches:
      - devel/koalo/container-nosoap
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag from branch name
        id: vars
        run: echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: contrib/containerfile-vmless/Containerfile.local
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/elbe-buildenv:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/elbe-buildenv:${{ github.sha }}
